<!-- start custom footer snippets -->
<script data-cfasync="false" type="module">
  import mermaid from
    'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  mermaid.initialize({
    startOnLoad: false,
    theme: 'default',
    securityLevel: 'strict'
  });

  const MERMAID_START =
    /^(flowchart|graph|sequenceDiagram|classDiagram|stateDiagram|erDiagram|gantt|pie|journey|mindmap|timeline)\b/;

  // Rouge does not know the "mermaid" language, so the generated HTML has no
  // language-mermaid class. Detect the blocks by their content instead.
  document.querySelectorAll('pre code').forEach((code) => {
    if (!MERMAID_START.test(code.textContent.trim())) return;

    const container = document.createElement('div');
    container.className = 'mermaid';
    container.textContent = code.textContent;

    const wrapper = code.closest('.highlighter-rouge')
      || code.closest('pre');

    wrapper.replaceWith(container);
  });

  await mermaid.run({
    querySelector: '.mermaid'
  });
</script>

<style>
  .mermaid {
    text-align: center;
    overflow-x: auto;
    margin: 1.5rem 0;
  }

  .mermaid svg {
    max-width: 100%;
    height: auto;
  }
</style>
<!-- end custom footer snippets -->
